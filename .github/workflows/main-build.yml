name: Main build

# The Mac app built from `main`, signed with the Developer ID, notarized
# and stapled (apple/scripts/release-app.sh), replacing Ganymede-macOS.zip
# on the rolling `main-build` prerelease, so one link always has the
# latest build (#539):
# https://github.com/tlockney/ganymede-ui/releases/download/main-build/Ganymede-macOS.zip
#
# It runs on each push to main that changes the app (scripts/ci-changes.sh
# `macos`), and by hand on main. It is not a release: no version tag, no
# appcast.xml, and the prerelease is never "latest", so the update feed
# (/releases/latest/download/appcast.xml) never offers it. The build reads
# that same feed, with a build number just above the latest release's,
# so the current release isn't offered to it and the next one replaces it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.changes.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A re-run of an older run would cancel the newest build in the
      # build job's group (when it queues, before its steps), then publish
      # would skip it as stale: stop it here. Only a re-run: a first
      # attempt may start after main moved on with a push that builds
      # nothing. "Re-run failed jobs" doesn't re-run this job; docs say
      # to start a manual run instead.
      - name: Stop a re-run of an older commit
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::error::main is at ${head::12}, not ${GITHUB_SHA::12}: start a manual run on main instead"
            exit 1
          fi
      # A manual run counts as a change.
      - id: changes
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.before }}

  # A newer build cancels an older one. An upload in progress is never
  # cancelled (the publish job's group); a queued one gives way to a
  # newer one. Only pushes that build join this group, so a
  # docs push doesn't cancel the app push before it.
  build:
    needs: changes
    if: needs.changes.outputs.macos != 'false'
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    concurrency:
      group: ${{ github.workflow }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GanymedeFFI.xcframework for GANYMEDE_REF, npm ci, xcodegen and
      # bootstrap.sh with source maps for Sentry; no caches, since this
      # build is signed (.github/actions/apple-setup, #547). Source maps
      # by debug ID, as release.yml: no release name to clash.
      - uses: ./.github/actions/apple-setup
        with:
          sentry-sourcemaps: 'true'
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # From the latest release: its build number, and the public key its
      # app accepts updates signed with. A main build signs no update, so
      # it never gets the private key.
      # Sparkle compares build numbers component by component: 24.12 is
      # above release build 24 and below the next release's run number.
      - name: Version, build number and update key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          latest="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          base=$(curl -fsSL --retry 3 "$latest/appcast.xml" |
            sed -n 's:.*<sparkle\:version>\([0-9][0-9]*\)</sparkle\:version>.*:\1:p' | head -n 1)
          [[ -n "$base" ]] || { echo "::error::no sparkle:version in the latest release's appcast.xml"; exit 1; }
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/latest.zip" "$latest/Ganymede-macOS-${tag#v}.zip"
          unzip -p "$RUNNER_TEMP/latest.zip" Ganymede.app/Contents/Info.plist > "$RUNNER_TEMP/Info.plist"
          key=$(plutil -extract SUPublicEDKey raw "$RUNNER_TEMP/Info.plist")
          [[ -n "$key" ]] || { echo "::error::$tag's app has no SUPublicEDKey"; exit 1; }
          rm "$RUNNER_TEMP/latest.zip"
          {
            echo "VERSION=$version"
            echo "BUILD_NUMBER=$base.$GITHUB_RUN_NUMBER"
            echo "SPARKLE_PUBLIC_ED_KEY=$key"
          } >> "$GITHUB_ENV"
          echo "Ganymede $version ($base.$GITHUB_RUN_NUMBER) from ${GITHUB_SHA::12}; update key from $tag: $key"
      - name: Sign, notarize, and staple
        run: apple/scripts/release-app.sh
        env:
          MAIN_BUILD: '1'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      - name: Notes
        run: |
          cat > apple/build/notes.md <<EOF
          The latest build of \`main\`, not a release: Ganymede $VERSION (build $BUILD_NUMBER), built from $GITHUB_SHA. Each push to main that changes the app replaces it.

          \`Ganymede-macOS.zip\` is the Mac app for Apple silicon, signed with the Developer ID and notarized. It is the same app as the release (same settings and data), and replaces it if you move it to Applications. It does not update to newer main builds; the next release's update replaces it.
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ganymede-macOS-main
          path: |
            apple/build/Ganymede-macOS.zip
            apple/build/SHA256SUMS-macOS
            apple/build/notes.md
          if-no-files-found: error

  # Replaces the assets of the `main-build` prerelease, so the download
  # URL never changes. `--clobber` deletes the asset before uploading its
  # replacement, so a download during an upload can 404: try again. The
  # tag moves to the build's commit when GitHub lets the workflow token
  # (not across commits that change workflow files); the notes and the
  # attestation name the commit either way.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: main-build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ganymede-macOS-main
          path: dist
      - name: Check the checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS-macOS
      # A re-run of an older run must not replace a newer build.
      - name: Skip if a newer build is published
        id: newer
        run: |
          if current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2> /dev/null) &&
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$current" --jq .status)" == ahead ]]; then
            echo "::notice::$TAG is at ${current::12}, newer than ${GITHUB_SHA::12}: not replacing it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.newer.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Ganymede-macOS.zip
      - name: Update the main-build prerelease
        if: steps.newer.outputs.skip != 'true'
        run: |
          # git/ref/ (singular) matches exactly; git/refs/ also matches prefixes.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null ||
              echo "::warning::could not move $TAG to $GITHUB_SHA; the assets are still updated"
          elif ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null; then
            # The same rule can refuse creating it at this commit (the
            # first run is on the commit that adds this workflow): start
            # it at the first parent, and a later run moves it.
            parent=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.parents[0].sha')
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$parent" > /dev/null
            echo "::warning::created $TAG at $parent, not $GITHUB_SHA; the assets are still this build"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # The app before its checksum: a download in between fails
            # its checksum rather than matching a stale one.
            gh release upload "$TAG" dist/Ganymede-macOS.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$TAG" dist/SHA256SUMS-macOS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/notes.md --prerelease --latest=false
          else
            gh release create "$TAG" dist/Ganymede-macOS.zip dist/SHA256SUMS-macOS --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Latest main build" --notes-file dist/notes.md --prerelease --latest=false
          fi
