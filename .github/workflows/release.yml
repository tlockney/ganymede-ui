name: Release

# tag-release.yml pushes a `v*` tag and starts this workflow on it. It runs
# CI on the tag, builds the app, packages `dist/` as a tarball and a zip
# with SHA-256 checksums, and publishes a GitHub Release whose notes are
# the version's CHANGELOG.md section, with a build provenance attestation
# per archive. The `macos` job adds the Mac app, signed with the Developer
# ID, notarized and stapled. Manual runs on a branch build, sign, notarize
# and package without publishing. docs/releasing.md says what to do when a run fails.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a release in progress is never cancelled. The group is
# not named after the workflow because ci.yml, called below, would compute
# the same name and wait on this run forever.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Read the package.json version; a tag must match it
        run: |
          version=$(jq -r .version package.json)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAME: ganymede-ui-${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The archives unpack to one ganymede-ui-X.Y.Z/ directory holding the
      # built site (index.html at its top) and the license.
      - name: Package
        run: |
          mkdir -p "pkg/$NAME"
          cp -R dist/. "pkg/$NAME/"
          cp LICENSE "pkg/$NAME/"
          cd pkg
          tar -czf "$NAME.tar.gz" "$NAME"
          zip -qr "$NAME.zip" "$NAME"
          sha256sum "$NAME.tar.gz" "$NAME.zip" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: |
            pkg/*.tar.gz
            pkg/*.zip
            pkg/SHA256SUMS
          if-no-files-found: error

  # The Mac app, signed with the Developer ID certificate, notarized, and
  # stapled: Ganymede-macOS-X.Y.Z.zip (apple/scripts/release-app.sh). The
  # secrets may live in a `release` environment with a required reviewer.
  macos:
    needs: [version, ci]
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ganymede commit ci.yml's macos-app job builds and tests the app
      # with, so the release links the same ganymede-ffi.
      - name: Read GANYMEDE_REF from ci.yml
        run: |
          ref=$(yq -r '.jobs["macos-app"].env.GANYMEDE_REF' .github/workflows/ci.yml)
          [[ "$ref" =~ ^[0-9a-f]{40}$|^v[0-9] ]] || { echo "::error::GANYMEDE_REF in ci.yml: $ref"; exit 1; }
          echo "GANYMEDE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlockney/ganymede
          ref: ${{ env.GANYMEDE_REF }}
          path: .ganymede
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: brew install xcodegen
      - run: apple/scripts/bootstrap.sh
        env:
          GANYMEDE_DIR: ${{ github.workspace }}/.ganymede
      - name: Sign, notarize, and staple
        run: apple/scripts/release-app.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ganymede-macOS-${{ needs.version.outputs.version }}
          path: |
            apple/build/Ganymede-macOS-*.zip
            apple/build/SHA256SUMS-macOS
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, build, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance: an OIDC token to sign with, and the right to
      # store the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check the checksums
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS-macOS
          cat SHA256SUMS-macOS >> SHA256SUMS
          rm SHA256SUMS-macOS
      # A signed SLSA provenance statement per archive: this repository,
      # workflow, tag, and commit built it. The checksums only catch a
      # damaged download; `gh attestation verify <archive> --repo
      # tlockney/ganymede-ui` checks this (docs/releasing.md).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION; cut releases with scripts/release.sh"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "${flags[@]}"
