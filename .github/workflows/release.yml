name: Release

# tag-release.yml pushes a `v*` tag and starts this workflow on it. It
# checks that the tagged commit's pull request passed CI, then builds the
# app while build and e2e run once more on the merged tree,
# packages `dist/` as a tarball and a zip with SHA-256 checksums, and
# publishes a GitHub Release whose notes are the version's CHANGELOG.md
# section, with a build provenance attestation per archive. The `macos`
# job adds the Mac app, signed with the Developer ID, notarized and
# stapled. The `ios` job uploads the iPad and iPhone app to TestFlight.
# Manual runs on a branch build, sign, notarize and package
# without publishing a release (they do upload to TestFlight); with
# `testflight_only`, they skip the web archives and the Mac app and only
# upload the iPad and iPhone app. Each upload gets "What to Test" notes
# listing the commits since the previous TestFlight build.
# docs/releasing.md says what to do when a run fails.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      testflight_only:
        description: Only upload the iPad and iPhone app to TestFlight (skip the web archives and the Mac app)
        type: boolean
        default: false

permissions:
  contents: read

# One run per ref; a release in progress is never cancelled. The group is
# not named after the workflow because ci.yml, called below, would compute
# the same name and wait on this run forever.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Read the package.json version; a tag must match it
        env:
          TESTFLIGHT_ONLY: ${{ inputs.testflight_only }}
        run: |
          version=$(jq -r .version package.json)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # On a tag it would skip the release job and still end green.
          if [[ "$GITHUB_REF_TYPE" == tag && "$TESTFLIGHT_ONLY" == true ]]; then
            echo "::error::testflight_only skips the release; run it on a branch, not a tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # On a tag: the tagged commit is the merge of a pull request into main
  # whose last completed CI run passed (#491). The app builds start once
  # this passes, without waiting on CI; tag-ci below runs alongside them.
  verify:
    if: github.ref_type == 'tag'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: The commit's pull request passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          sha=$GITHUB_SHA
          # GitHub links a merge commit to its pull request a little after
          # the merge, and tag-release starts this run at once: retry.
          for attempt in 1 2 3 4 5 6; do
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == "'"$sha"'")][0] | "\(.number) \(.head.sha)"')
            [[ -n "$pr" && "$pr" != "null null" ]] && break
            sleep 10
          done
          [[ -n "$pr" && "$pr" != "null null" ]] || fail "${sha::12} is not the merge of a pull request into main"
          number=${pr% *} head=${pr#* }
          # The newest completed run: a re-run still going after the merge
          # doesn't count against the one that gated it.
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "none"')
          [[ "$conclusion" == success ]] || fail "CI on #$number (${head::12}) is '$conclusion', not success"
          echo "${sha::12} is #$number, whose CI passed on ${head::12}"

  # Manual runs on a branch, which may not have been through a pull
  # request: build and e2e. macos-app is skipped: the macos and ios jobs
  # below build the app (#361).
  ci:
    if: github.ref_type != 'tag'
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      skip_macos: true
    permissions:
      contents: read

  # On a tag: build and e2e on the merged tree, which the release PR's run
  # and main's push run skip for a version and changelog change. It runs
  # alongside the app builds, and `release` waits for it.
  tag-ci:
    if: github.ref_type == 'tag'
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      skip_macos: true
    permissions:
      contents: read

  build:
    needs: [version, verify, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.verify.result == 'success' || needs.ci.result == 'success') && !inputs.testflight_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAME: ganymede-ui-${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Source maps go to Sentry for error reports (#319), not into the archives.
      - run: npm run build
        env:
          SENTRY_SOURCEMAPS: '1'
      - run: scripts/sentry-sourcemaps.sh dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # The archives unpack to one ganymede-ui-X.Y.Z/ directory holding the
      # built site (index.html at its top) and the license.
      - name: Package
        run: |
          mkdir -p "pkg/$NAME"
          cp -R dist/. "pkg/$NAME/"
          cp LICENSE "pkg/$NAME/"
          cd pkg
          tar -czf "$NAME.tar.gz" "$NAME"
          zip -qr "$NAME.zip" "$NAME"
          sha256sum "$NAME.tar.gz" "$NAME.zip" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: |
            pkg/*.tar.gz
            pkg/*.zip
            pkg/SHA256SUMS
          if-no-files-found: error

  # The Mac app, signed with the Developer ID certificate, notarized, and
  # stapled: Ganymede-macOS-X.Y.Z.zip (apple/scripts/release-app.sh), and
  # appcast.xml, the update feed the app reads from the latest release
  # (#411). The secrets may live in a `release` environment with a
  # required reviewer.
  macos:
    needs: [version, verify, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.verify.result == 'success' || needs.ci.result == 'success') && !inputs.testflight_only }}
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ganymede commit ci.yml's macos-app job builds and tests the app
      # with, so the release links the same ganymede-ffi.
      - name: Read GANYMEDE_REF from ci.yml
        run: |
          ref=$(yq -r '.jobs["macos-app"].env.GANYMEDE_REF' .github/workflows/ci.yml)
          [[ "$ref" =~ ^[0-9a-f]{40}$|^v[0-9] ]] || { echo "::error::GANYMEDE_REF in ci.yml: $ref"; exit 1; }
          echo "GANYMEDE_REF=$ref" >> "$GITHUB_ENV"
      # A release tag is downloaded by bootstrap.sh; a commit is built (#359).
      - if: ${{ !startsWith(env.GANYMEDE_REF, 'v') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlockney/ganymede
          ref: ${{ env.GANYMEDE_REF }}
          path: .ganymede
          persist-credentials: false
      - if: ${{ !startsWith(env.GANYMEDE_REF, 'v') }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: brew install xcodegen
      - run: apple/scripts/bootstrap.sh
        env:
          GANYMEDE_DIR: ${{ !startsWith(env.GANYMEDE_REF, 'v') && format('{0}/.ganymede', github.workspace) || '' }}
          SENTRY_SOURCEMAPS: '1'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Sign, notarize, and staple
        run: apple/scripts/release-app.sh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ganymede-macOS-${{ needs.version.outputs.version }}
          path: |
            apple/build/Ganymede-macOS-*.zip
            apple/build/SHA256SUMS-macOS
            apple/build/appcast.xml
          if-no-files-found: error

  # The iPad and iPhone app, signed for App Store distribution and
  # uploaded to TestFlight for internal testing (apple/scripts/release-ios.sh,
  # #188). Manual runs on a branch upload too. The GitHub Release does not
  # wait for it: a TestFlight failure doesn't hold the web and Mac release.
  ios:
    needs: [version, verify, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.verify.result == 'success' || needs.ci.result == 'success') }}
    runs-on: macos-latest
    # The notes step waits up to 40 minutes for App Store Connect.
    timeout-minutes: 130
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The TestFlight notes list the commits since the last build or tag.
          fetch-depth: 0
      - name: Read GANYMEDE_REF from ci.yml
        run: |
          ref=$(yq -r '.jobs["macos-app"].env.GANYMEDE_REF' .github/workflows/ci.yml)
          [[ "$ref" =~ ^[0-9a-f]{40}$|^v[0-9] ]] || { echo "::error::GANYMEDE_REF in ci.yml: $ref"; exit 1; }
          echo "GANYMEDE_REF=$ref" >> "$GITHUB_ENV"
      # A release tag is downloaded by bootstrap.sh; a commit is built (#359).
      - if: ${{ !startsWith(env.GANYMEDE_REF, 'v') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlockney/ganymede
          ref: ${{ env.GANYMEDE_REF }}
          path: .ganymede
          persist-credentials: false
      - if: ${{ !startsWith(env.GANYMEDE_REF, 'v') }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: brew install xcodegen
      - run: apple/scripts/bootstrap.sh
        env:
          GANYMEDE_DIR: ${{ !startsWith(env.GANYMEDE_REF, 'v') && format('{0}/.ganymede', github.workspace) || '' }}
          SENTRY_SOURCEMAPS: '1'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Sign and upload to TestFlight
        run: apple/scripts/release-ios.sh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      # "What to Test": the commits since the previous TestFlight build
      # (#466). The upload has already succeeded if this step fails.
      - name: Set the TestFlight notes
        run: node scripts/testflight-notes.mjs
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}

  # The status checks are spelled out: an `if` without one gets an
  # implicit success(), which the skipped `ci` job ahead of build and
  # macos would make false, skipping the release with no failed job.
  release:
    needs: [version, build, macos, tag-ci]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.build.result == 'success' && needs.macos.result == 'success' && needs.tag-ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance: an OIDC token to sign with, and the right to
      # store the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only this workflow's own archives: the called CI run (tag-ci) also uploads
      # its ad-hoc signed Ganymede-macOS build and e2e screenshots, which
      # must not reach the release (#334).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ganymede-ui-${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ganymede-macOS-${{ needs.version.outputs.version }}
          path: dist
      - name: Check the checksums
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS-macOS
          cat SHA256SUMS-macOS >> SHA256SUMS
          rm SHA256SUMS-macOS
      # A signed SLSA provenance statement per archive: this repository,
      # workflow, tag, and commit built it. The checksums only catch a
      # damaged download; `gh attestation verify <archive> --repo
      # tlockney/ganymede-ui` checks this (docs/releasing.md).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION; cut releases with scripts/release.sh"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "${flags[@]}"
