name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks on the tag alongside its app builds,
  # and on manual branch runs before them, without macos-app and ios-app:
  # the last app change passed them on main, and release.yml's own macos
  # and ios jobs build the apps (#361, #491).
  workflow_call:
    inputs:
      skip_macos:
        description: Skip the macos-app and ios-app jobs
        type: boolean
        default: false

permissions:
  contents: read

# The tlockney/ganymede tag or commit whose ganymede-ffi the apps link, for
# macos-app and ios-app here and for release.yml and main-build.yml, which
# read it from this file.
env:
  # A tag downloads the release's XCFramework; a commit builds it.
  GANYMEDE_REF: v0.10.0

# A new push to a pull request cancels its older run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the slow jobs below a pull request needs: scripts/ci-changes.sh
  # skips e2e, macos-app and ios-app when the PR can't affect them (docs, a release
  # PR's version bump, or only the other job's files) (#344). A job skipped
  # by its `if` reports success, so the required checks pass. If this job
  # fails, its outputs are empty and every job runs. A push to main is
  # checked the same way (#360); any other event runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.changes.outputs.e2e }}
      macos: ${{ steps.changes.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base.
          fetch-depth: 2
      - id: changes
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
        env:
          # A push's base: main before the push (the script fetches it).
          BASE_SHA: ${{ github.event.before }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The built app against a real `ganymede serve` (a pinned release binary,
  # no Python) running cdp-kernel's TypeScript kernel, and against the
  # in-browser kernel, driven by Playwright (e2e/, `npm run e2e`).
  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # What this job installs, in one place.
      GANYMEDE_VERSION: 0.10.0
      CDP_KERNEL_VERSION: 0.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Ganymede and cdp-kernel
        run: |
          # The install script from the same tag as the binary.
          curl -fsSL "https://raw.githubusercontent.com/tlockney/ganymede/v$GANYMEDE_VERSION/site/install.sh" \
            | sh -s -- --version "$GANYMEDE_VERSION" --no-kernel --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g "@tlockney/cdp-kernel@$CDP_KERNEL_VERSION"
          cdp-kernel install --runtime node
          "$HOME/.local/bin/ganymede" --version
          "$HOME/.local/bin/ganymede" kernelspec list
      - run: npm ci
      # Chromium, keyed on the installed Playwright version, so the key
      # changes only when the browser does.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      # Best effort for the system libraries: the runner image has
      # Chromium's (it ships Chrome), so an apt mirror outage shouldn't
      # fail the job (#499). Bounded: apt takes ~10 minutes to give up,
      # and `timeout` stops npx, not the apt-get it started.
      - run: |
          npx playwright install chromium
          timeout 5m npx playwright install-deps chromium || { sudo pkill -x apt-get || true; echo "::warning::apt failed; using the runner image's libraries"; }
      - run: npm run build
      - run: npm run e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test-results/screenshots
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  # The macOS app in apple/: gets ganymede-ffi's XCFramework from a
  # tlockney/ganymede release (or builds it), bundles this repo's build, and runs the XCTest
  # suite (the server started, serving the page, stopped).
  macos-app:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' && !inputs.skip_macos }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GanymedeFFI.xcframework for GANYMEDE_REF, npm ci, xcodegen and
      # bootstrap.sh, with caches (.github/actions/apple-setup, #547).
      - uses: ./.github/actions/apple-setup
        with:
          caches: 'true'
      - name: Build and test
        run: >
          xcodebuild test -project apple/Ganymede.xcodeproj -scheme Ganymede
          -destination platform=macOS -derivedDataPath apple/build/DerivedData
          -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      # The Debug build the tests ran. release-app.sh runs the same check
      # on the Release build main-build.yml and release.yml sign (#549).
      - name: Check the app bundle
        run: apple/scripts/check-app-bundle.sh apple/build/DerivedData/Build/Products/Debug/Ganymede.app

  # The iPad and iPhone app's tests on an iPad simulator, on its own runner
  # alongside macos-app (#543). Same setup; both jobs use the ffi cache, so
  # when a new commit pin misses it, each builds the XCFramework once.
  ios-app:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' && !inputs.skip_macos }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GanymedeFFI.xcframework for GANYMEDE_REF, npm ci, xcodegen and
      # bootstrap.sh, with caches (.github/actions/apple-setup, #547).
      - uses: ./.github/actions/apple-setup
        with:
          caches: 'true'
      - name: Build and test for iPadOS (simulator)
        run: |
          # Simulator names change with each Xcode; take the first iPad.
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
             | select(.name | startswith("iPad"))][0].udid')
          xcodebuild test -project apple/Ganymede.xcodeproj -scheme Ganymede-iOS \
            -destination "id=$udid" -derivedDataPath apple/build/DerivedData \
            -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
