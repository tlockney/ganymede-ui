name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks on the tag before it builds, without
  # macos-app: the tagged commit passed it on main, and release.yml's own
  # macos and ios jobs build the app (#361).
  workflow_call:
    inputs:
      skip_macos:
        description: Skip the macos-app job
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the slow jobs below a pull request needs: scripts/ci-changes.sh
  # skips e2e and macos-app when the PR can't affect them (docs, a release
  # PR's version bump, or only the other job's files) (#344). A job skipped
  # by its `if` reports success, so the required checks pass. If this job
  # fails, its outputs are empty and both jobs run. Any other event runs
  # everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.changes.outputs.e2e }}
      macos: ${{ steps.changes.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base.
          fetch-depth: 2
      - id: changes
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The built app against a real `ganymede serve` (a pinned release binary,
  # no Python) running cdp-kernel's TypeScript kernel, and against the
  # in-browser kernel, driven by Playwright (e2e/, `npm run e2e`).
  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # What this job installs, in one place.
      GANYMEDE_VERSION: 0.7.0
      CDP_KERNEL_VERSION: 0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Ganymede and cdp-kernel
        run: |
          # The install script from the same tag as the binary.
          curl -fsSL "https://raw.githubusercontent.com/tlockney/ganymede/v$GANYMEDE_VERSION/site/install.sh" \
            | sh -s -- --version "$GANYMEDE_VERSION" --no-kernel --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g "@tlockney/cdp-kernel@$CDP_KERNEL_VERSION"
          cdp-kernel install --runtime node
          "$HOME/.local/bin/ganymede" --version
          "$HOME/.local/bin/ganymede" kernelspec list
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test-results/screenshots
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  # The macOS app in apple/: builds ganymede-ffi as an XCFramework from
  # tlockney/ganymede, bundles this repo's build, and runs the XCTest
  # suite (the server started, serving the page, stopped).
  macos-app:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' && !inputs.skip_macos }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # The tlockney/ganymede tag or commit whose ganymede-ffi the app links.
      # v0.7.0, the latest Ganymede release (includes ganymede#390, the ffi panic callback, #318).
      GANYMEDE_REF: v0.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlockney/ganymede
          ref: ${{ env.GANYMEDE_REF }}
          path: .ganymede
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .ganymede
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: brew install xcodegen
      - run: apple/scripts/bootstrap.sh
        env:
          GANYMEDE_DIR: ${{ github.workspace }}/.ganymede
      - name: Build and test
        run: >
          xcodebuild test -project apple/Ganymede.xcodeproj -scheme Ganymede
          -destination platform=macOS -derivedDataPath apple/build/DerivedData
          -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      # The Release build to download, on main only (#361): pull requests
      # get the Debug build above, which the next step checks.
      - name: Build the app for download
        if: github.event_name != 'pull_request'
        run: |
          xcodebuild build -project apple/Ganymede.xcodeproj -scheme Ganymede \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath apple/build/DerivedData \
            -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Check the app bundle
        env:
          CONFIGURATION: ${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }}
        run: |
          app=apple/build/DerivedData/Build/Products/$CONFIGURATION/Ganymede.app
          # Finder can open notebooks with it (#130).
          /usr/libexec/PlistBuddy -c 'Print :UTImportedTypeDeclarations:0:UTTypeIdentifier' \
            "$app/Contents/Info.plist" | grep -qx org.jupyter.ipynb
          # Quick Look preview and thumbnails, with the preview page (#135).
          plugins=$app/Contents/PlugIns
          for ext in GanymedeQuickLook:com.apple.quicklook.preview GanymedeThumbnail:com.apple.quicklook.thumbnail; do
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' \
              "$plugins/${ext%%:*}.appex/Contents/Info.plist" | grep -qx "${ext#*:}"
          done
          test -f "$plugins/GanymedeQuickLook.appex/Contents/Resources/quicklook/preview.html"
      - if: github.event_name != 'pull_request'
        run: |
          ditto -c -k --keepParent \
            apple/build/DerivedData/Build/Products/Release/Ganymede.app apple/build/Ganymede-macOS.zip
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ganymede-macOS
          path: apple/build/Ganymede-macOS.zip
          if-no-files-found: error
      - name: Build and test for iPadOS (simulator)
        run: |
          # Simulator names change with each Xcode; take the first iPad.
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
             | select(.name | startswith("iPad"))][0].udid')
          xcodebuild test -project apple/Ganymede.xcodeproj -scheme Ganymede-iOS \
            -destination "id=$udid" -derivedDataPath apple/build/DerivedData \
            -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
