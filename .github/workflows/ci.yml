name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks on the tag before it builds.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The built app against a real `ganymede serve` (a pinned release binary,
  # no Python) running cdp-kernel's TypeScript kernel, and against the
  # in-browser kernel, driven by Playwright (e2e/, `npm run e2e`).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # What this job installs, in one place.
      GANYMEDE_VERSION: 0.3.0
      CDP_KERNEL_VERSION: 0.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Ganymede and cdp-kernel
        run: |
          # The install script from the same tag as the binary.
          curl -fsSL "https://raw.githubusercontent.com/tlockney/ganymede/v$GANYMEDE_VERSION/site/install.sh" \
            | sh -s -- --version "$GANYMEDE_VERSION" --no-kernel --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g "@tlockney/cdp-kernel@$CDP_KERNEL_VERSION"
          cdp-kernel install --runtime node
          "$HOME/.local/bin/ganymede" --version
          "$HOME/.local/bin/ganymede" kernelspec list
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test-results/screenshots
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
