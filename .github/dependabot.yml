# Weekly version bumps. Minor and patch bumps are grouped into one pull
# request per ecosystem; each npm major gets its own, so one breaking
# upgrade doesn't hold back the rest. Security updates come as soon as an advisory is published,
# whatever this schedule says. Actions are pinned by commit SHA with the
# version in a comment; Dependabot updates both.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # vitest and its plugins must share one version, majors included.
      vitest:
        patterns: ['vitest', '@vitest/*']
      # @vitejs/plugin-react's majors follow Vite's (#147); minor and patch
      # bumps come here too. vitest and vite-plugin-pwa also cap their vite
      # peer, so a Vite major can still wait for them.
      vite:
        patterns: ['vite', '@vitejs/*']
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: 0.4.0-alpha.4 and alpha.5 are broken on npm
      # (docs/notes/2026-10-18-drop-jupyter-react.md). Bump by hand.
      - dependency-name: '@jupyterlite/javascript-kernel'
      # ipywidgets uses Font Awesome 5's class names, as JupyterLab does
      # (src/styles/fontawesome.css).
      - dependency-name: '@fortawesome/fontawesome-free'
        update-types: [version-update:semver-major]
      # Must match the version @jupyterlab/ui-components uses; 0.17.1 broke
      # the tests while JupyterLab 4.6 was on 0.16.7. Bump with JupyterLab.
      - dependency-name: '@jupyter/web-components'
