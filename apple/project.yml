# XcodeGen spec: `xcodegen generate` writes Ganymede.xcodeproj (not
# committed). scripts/bootstrap.sh fills build/ first.
name: Ganymede
options:
  bundleIdPrefix: com.ganymede-server
  deploymentTarget:
    macOS: '26.0'
    iOS: '26.0'
  createIntermediateGroups: true
packages:
  # The terminal view (MIT), on macOS and iOS. libghostty may replace it
  # once its official Swift package ships (#117).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.2
  # SSH on iOS (Apache-2.0, Apple), which can't run /usr/bin/ssh (#121).
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    exactVersion: 0.15.1
  # Its event loops and sockets; swift-nio-ssh needs 2.81 or later.
  swift-nio:
    url: https://github.com/apple/swift-nio
    exactVersion: 2.104.0
  # The text editor's highlighting (#122): Neon (BSD-3) on tree-sitter
  # (MIT). Neon's main branch is not tagged, so it is pinned to a commit.
  # Neon asks for SwiftTreeSitter's main branch, and SwiftPM refuses a
  # second, different requirement on the same package, so it follows main.
  Neon:
    url: https://github.com/ChimeHQ/Neon
    revision: 38cf4a6a05a6aa1e038b65a16f773c77d4145efc
  SwiftTreeSitter:
    url: https://github.com/ChimeHQ/SwiftTreeSitter
    branch: main
  # Their own dependencies, pinned so a fresh resolve builds the same.
  tree-sitter:
    url: https://github.com/tree-sitter/tree-sitter
    exactVersion: 0.25.10
  Rearrange:
    url: https://github.com/ChimeHQ/Rearrange
    exactVersion: 2.1.1
  # Grammars (MIT), with their highlight queries. Python 0.25, JavaScript
  # 0.25 and YAML 0.7.1 add their scanner.c only if the manifest finds it
  # relative to the working directory, which Xcode's isn't, so their
  # scanners don't link; the versions before list it outright.
  TreeSitterBash:
    url: https://github.com/tree-sitter/tree-sitter-bash
    exactVersion: 0.25.1
  TreeSitterJavaScript:
    url: https://github.com/tree-sitter/tree-sitter-javascript
    exactVersion: 0.23.1
  TreeSitterJSON:
    url: https://github.com/tree-sitter/tree-sitter-json
    exactVersion: 0.24.8
  TreeSitterMarkdown:
    url: https://github.com/tree-sitter-grammars/tree-sitter-markdown
    exactVersion: 0.5.4
  TreeSitterPython:
    url: https://github.com/tree-sitter/tree-sitter-python
    exactVersion: 0.23.6
  TreeSitterTOML:
    url: https://github.com/tree-sitter-grammars/tree-sitter-toml
    exactVersion: 0.7.0
  TreeSitterTypeScript:
    url: https://github.com/tree-sitter/tree-sitter-typescript
    exactVersion: 0.23.2
  TreeSitterYAML:
    url: https://github.com/tree-sitter-grammars/tree-sitter-yaml
    exactVersion: 0.7.0
  # Opt-in crash reports (#318, MIT): Sentry's SDK, as its static
  # XCFramework. Started only when the person says yes (CrashReports.swift).
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.31.0
  # Updates for the Mac app (#411, MIT): finds, downloads, checks and
  # installs new releases (AppUpdater.swift). Mac target only.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  # The `device` bridge for notebook cells, on the kernel web view only (#99).
  GanymedeDevice:
    url: https://github.com/tlockney/ganymede-device
    revision: 1c91ace6475140e492c1cc8585ff7d77637dcfb2
settings:
  base:
    SWIFT_VERSION: '5.0'
    # Apple silicon only (#356): Intel Macs stop at macOS 26.
    ARCHS[sdk=macosx*]: arm64
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  Ganymede:
    type: application
    platform: macOS
    sources:
      - path: Sources/Ganymede
      # The App Group and the share sheet's notebooks (#449).
      - path: Sources/Share/AppGroup.swift
      - path: Sources/Share/ShareNotebooks.swift
      # ganymede-ui's build, served by the in-process server.
      - path: build/web
        type: folder
        buildPhase: resources
      # The headless script runner's engine (#69, a spike; nothing runs
      # it yet), from `npm run build:runner`.
      - path: build/runner
        type: folder
        buildPhase: resources
      # The app icon, in macOS's grid (#281; scripts/mac-icon.py).
      - path: Resources/macOS
    dependencies:
      - framework: build/GanymedeFFI.xcframework
        embed: false
      - package: SwiftTerm
      - package: GanymedeDevice
        product: DeviceBridge
      - package: Sentry
      - package: Sparkle
      - package: Neon
      - package: SwiftTreeSitter
      - package: TreeSitterBash
      - package: TreeSitterJavaScript
      - package: TreeSitterJSON
      - package: TreeSitterMarkdown
      - package: TreeSitterPython
      - package: TreeSitterTOML
      - package: TreeSitterTypeScript
      - package: TreeSitterYAML
      # Quick Look preview and Finder thumbnails for notebooks (#135),
      # embedded in Contents/PlugIns.
      - target: GanymedeQuickLook
      - target: GanymedeThumbnail
      # The share sheet's Run a Notebook (#435, #449).
      - target: GanymedeShare
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Ganymede
        GanymedeAppGroup: $(TeamIdentifierPrefix)com.ganymede-server.Ganymede
        # XcodeGen writes 1.0 and 1 otherwise; release-app.sh sets these.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: MIT License
        # Export compliance, so App Store Connect builds don't stop at
        # Missing Compliance (#322): only standard TLS and SSH, no custom
        # algorithms.
        ITSAppUsesNonExemptEncryption: false
        # Updates (#411). release-app.sh sets the feed and the public key
        # its updates are signed with; other builds leave them empty and
        # don't update themselves. Checks run daily without asking first;
        # installing asks unless the person turns that on in Settings.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        # The device API's permissioned namespaces (#422): the system
        # shows these after the app's own prompt for the notebook.
        NSLocationWhenInUseUsageDescription: A notebook asked for your location.
        NSPhotoLibraryAddUsageDescription: A notebook asked to save an image to your photo library.
        NSContactsUsageDescription: A notebook asked to use your contacts.
        NSRemindersFullAccessUsageDescription: A notebook asked to use your reminders.
        NSBluetoothAlwaysUsageDescription: A notebook asked to use Bluetooth.
        # The web view loads the server on 127.0.0.1 over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Opens .ipynb files from the Finder, and can be their default app
        # (#130). The type is imported: Jupyter defines the format.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Jupyter Notebook
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.jupyter.ipynb
          # By extension, for when another app's type for .ipynb wins over
          # ours: the Finder still offers Ganymede in Open With. (An entry
          # with LSItemContentTypes ignores CFBundleTypeExtensions.)
          - CFBundleTypeName: Jupyter Notebook (by extension)
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - ipynb
        # `ganymede://` URLs (#303; AppURL, AppURLHandler).
        CFBundleURLTypes:
          - CFBundleURLName: com.ganymede-server.Ganymede
            CFBundleURLSchemes:
              - ganymede
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.jupyter.ipynb
            UTTypeDescription: Jupyter Notebook
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - ipynb
              public.mime-type:
                - application/x-ipynb+json
    entitlements:
      path: build/Ganymede.entitlements
      properties:
        # Kernels are child processes from installed kernelspecs, which
        # the App Sandbox does not allow; distribution is Developer ID.
        com.apple.security.app-sandbox: false
        # Shared with the share extension (#449): team-prefixed, which a
        # Developer ID build can use without a provisioning profile.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.ganymede-server.Ganymede
        # The hardened runtime's resource access, for the device API's
        # permissioned namespaces (#422). Without one, the system refuses
        # that permission without asking. A Mac has no camera in the app.
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganymede-server.Ganymede
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty except in release builds (release-app.sh, #411).
        SPARKLE_FEED_URL: ''
        SPARKLE_PUBLIC_ED_KEY: ''
  # Quick Look's preview of a notebook (#135): ganymede-ui's notebook view
  # from `npm run build:quicklook`, read-only, no server or kernel.
  GanymedeQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLook/Preview
      - path: build/quicklook
        type: folder
        buildPhase: resources
    info:
      path: build/Info-QuickLook.plist
      properties:
        CFBundleDisplayName: Ganymede Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: MIT License
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.jupyter.ipynb
            QLSupportsSearchableItems: false
    entitlements:
      path: build/GanymedeQuickLook.entitlements
      properties:
        # Quick Look runs preview extensions only sandboxed.
        com.apple.security.app-sandbox: true
        # WebKit's networking process serves even the extension's own
        # scheme, and a sandboxed web view without this is reported to
        # draw nothing. The page's Content-Security-Policy loads nothing
        # from the network.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganymede-server.Ganymede.QuickLook
        ENABLE_HARDENED_RUNTIME: YES
  # The Finder's thumbnail of a notebook (#135), drawn natively.
  GanymedeThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLook/Thumbnail
    info:
      path: build/Info-Thumbnail.plist
      properties:
        CFBundleDisplayName: Ganymede Thumbnails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: MIT License
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.jupyter.ipynb
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: build/GanymedeThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganymede-server.Ganymede.Thumbnail
        ENABLE_HARDENED_RUNTIME: YES
  # The share extension (#435, a spike, off until Settings › Device turns
  # it on): runs a notebook offered to the share sheet on what was shared.
  # Embedded in the apps; shares an App Group with them (#449).
  GanymedeShare:
    type: app-extension
    platform: macOS
    sources: &shareSources
      - path: Sources/Share
      - path: Sources/Ganymede/Runner/ScriptRunner.swift
      - path: build/runner
        type: folder
        buildPhase: resources
    dependencies: &shareDependencies
      - package: GanymedeDevice
        product: DeviceBridge
    info:
      path: build/Info-Share.plist
      properties:
        GanymedeAppGroup: $(TeamIdentifierPrefix)com.ganymede-server.Ganymede
        CFBundleDisplayName: Run a Notebook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: MIT License
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
        NSLocationWhenInUseUsageDescription: A notebook asked for your location.
        NSContactsUsageDescription: A notebook asked to use your contacts.
        NSRemindersFullAccessUsageDescription: A notebook asked to use your reminders.
    entitlements:
      path: build/GanymedeShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.ganymede-server.Ganymede
        # fetch, and the namespaces the extension's bridge has.
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganymede-server.Ganymede.Share
        ENABLE_HARDENED_RUNTIME: YES
  GanymedeShare-iOS:
    type: app-extension
    platform: iOS
    sources: *shareSources
    dependencies: *shareDependencies
    info:
      path: build/Info-Share-iOS.plist
      properties:
        GanymedeAppGroup: group.com.ganymede-server.Ganymede
        CFBundleDisplayName: Run a Notebook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: MIT License
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
        NSLocationWhenInUseUsageDescription: A notebook asked for your location.
        NSContactsUsageDescription: A notebook asked to use your contacts.
        NSRemindersFullAccessUsageDescription: A notebook asked to use your reminders.
    entitlements:
      path: build/GanymedeShare-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ganymede-server.Ganymede
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganymede-server.Ganymede.Share
        PRODUCT_NAME: GanymedeShare
        TARGETED_DEVICE_FAMILY: '1,2'
        # release-ios.sh names its App Store profile here (#449).
        PROVISIONING_PROFILE_SPECIFIER: $(GANYMEDE_IOS_SHARE_PROFILE)
  # iPad and iPhone, from the same sources. iOS cannot launch kernel
  # processes, so until an on-device kernel exists it edits notebooks
  # without running them.
  Ganymede-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Ganymede
      - path: Sources/Share/AppGroup.swift
      - path: Sources/Share/ShareNotebooks.swift
      - path: build/web
        type: folder
        buildPhase: resources
      # The headless script runner's engine (#69, a spike; nothing runs
      # it yet), from `npm run build:runner`.
      - path: build/runner
        type: folder
        buildPhase: resources
      # The app icon and the privacy manifest App Store Connect checks (#188).
      - path: Resources/iOS
    dependencies:
      - framework: build/GanymedeFFI.xcframework
        embed: false
      - package: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: GanymedeDevice
        product: DeviceBridge
      - package: Sentry
      # The share sheet's Run a Notebook (#435, #449).
      - target: GanymedeShare-iOS
      - package: Neon
      - package: SwiftTreeSitter
      - package: TreeSitterBash
      - package: TreeSitterJavaScript
      - package: TreeSitterJSON
      - package: TreeSitterMarkdown
      - package: TreeSitterPython
      - package: TreeSitterTOML
      - package: TreeSitterTypeScript
      - package: TreeSitterYAML
    info:
      path: build/Info-iOS.plist
      properties:
        GanymedeAppGroup: group.com.ganymede-server.Ganymede
        CFBundleDisplayName: Ganymede
        # XcodeGen writes 1.0 and 1 otherwise; release-app.sh sets these.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: MIT License
        # Export compliance, so App Store Connect builds don't stop at
        # Missing Compliance (#322): only standard TLS and SSH, no custom
        # algorithms.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          # Terminals open in their own scene beside the notebook on iPad.
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The Documents folder appears in the Files app, and notebooks
        # there are edited in place.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The device API's permissioned namespaces (#422): the system
        # shows these after the app's own prompt for the notebook.
        NSLocationWhenInUseUsageDescription: A notebook asked for your location.
        NSPhotoLibraryAddUsageDescription: A notebook asked to save an image to your photo library.
        NSContactsUsageDescription: A notebook asked to use your contacts.
        NSRemindersFullAccessUsageDescription: A notebook asked to use your reminders.
        NSBluetoothAlwaysUsageDescription: A notebook asked to use Bluetooth.
        NSCameraUsageDescription: A notebook asked to take a photo.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: build/Ganymede-iOS.entitlements
      properties:
        # Shared with the share extension (#449), registered for the team.
        com.apple.security.application-groups:
          - group.com.ganymede-server.Ganymede
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganymede-server.Ganymede
        PRODUCT_NAME: Ganymede
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # release-ios.sh names its App Store profile here, for this target
        # only: on the command line it would reach the packages' targets,
        # which can't take one. Empty otherwise.
        PROVISIONING_PROFILE_SPECIFIER: $(GANYMEDE_IOS_PROFILE)
  GanymedeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GanymedeTests
      - path: Sources/Ganymede/ServerHost.swift
      - path: Sources/Ganymede/KernelHost.swift
      - path: Sources/Ganymede/AppKernels.swift
      - path: Sources/Ganymede/LedgerPrompter.swift
      - path: Sources/Ganymede/DeviceSettings.swift
      - path: Sources/Ganymede/Terminal/TerminalTransport.swift
      - path: Sources/Ganymede/Terminal/TerminalTarget.swift
      - path: Sources/Ganymede/PanelController.swift
      - path: Sources/Ganymede/InspectorController.swift
      - path: Sources/Ganymede/WindowLayout.swift
      - path: Sources/Ganymede/Terminal/OpenTerminals.swift
      - path: Sources/Ganymede/Terminal/JupyterTerminalTransport.swift
      - path: Sources/Ganymede/WindowTarget.swift
      - path: Sources/Ganymede/Remote.swift
      - path: Sources/Ganymede/AgentKeys.swift
      - path: Sources/Ganymede/DocumentMessage.swift
      - path: Sources/Ganymede/PageState.swift
      - path: Sources/Ganymede/KernelSpecs.swift
      - path: Sources/Ganymede/SettingsTab.swift
      - path: Sources/Ganymede/CodeFont.swift
      - path: Sources/Ganymede/ShortcutsPane.swift
      - path: Sources/Ganymede/KernelLog.swift
      - path: Sources/Ganymede/FolderEntry.swift
      - path: Sources/Ganymede/WorkspaceTabs.swift
      - path: Sources/Ganymede/FileSearch.swift
      - path: Sources/Ganymede/Terminal/SSHKey.swift
      - path: Sources/Ganymede/Editor/TextFile.swift
      - path: Sources/Ganymede/Editor/CodeEditing.swift
      - path: Sources/Ganymede/FileStack.swift
      - path: Sources/Ganymede/CrashScrub.swift
      - path: Sources/Ganymede/NotebookActions.swift
      - path: Sources/Ganymede/AppURL.swift
      - path: Sources/Ganymede/HelpLinks.swift
      - path: Sources/Ganymede/Terminal/ProcessTerminalTransport.swift
      - path: Sources/Ganymede/UpdateFeed.swift
      - path: Sources/QuickLook/Preview/PreviewResources.swift
      - path: Sources/QuickLook/Thumbnail/NotebookSummary.swift
      - path: Sources/QuickLook/Thumbnail/ThumbnailProvider.swift
      - path: Sources/Ganymede/Runner/ScriptRunner.swift
      - path: Sources/Ganymede/Runner/ScriptIntents.swift
      - path: Sources/Share/ShareNotebooks.swift
      - path: Sources/Share/ShareInput.swift
      - path: Sources/Share/AppGroup.swift
      - path: build/runner
        type: folder
        buildPhase: resources
    dependencies:
      - framework: build/GanymedeFFI.xcframework
        embed: false
      - package: SwiftTerm
      - package: GanymedeDevice
        product: DeviceBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  GanymedeTests-iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/GanymedeTests
      - path: Sources/Ganymede/ServerHost.swift
      - path: Sources/Ganymede/KernelHost.swift
      - path: Sources/Ganymede/AppKernels.swift
      - path: Sources/Ganymede/LedgerPrompter.swift
      - path: Sources/Ganymede/DeviceSettings.swift
      - path: Sources/Ganymede/Terminal/TerminalTransport.swift
      - path: Sources/Ganymede/Terminal/TerminalTarget.swift
      - path: Sources/Ganymede/PanelController.swift
      - path: Sources/Ganymede/InspectorController.swift
      - path: Sources/Ganymede/WindowLayout.swift
      - path: Sources/Ganymede/Terminal/OpenTerminals.swift
      - path: Sources/Ganymede/Terminal/JupyterTerminalTransport.swift
      - path: Sources/Ganymede/WindowTarget.swift
      - path: Sources/Ganymede/Remote.swift
      - path: Sources/Ganymede/AgentKeys.swift
      - path: Sources/Ganymede/DocumentMessage.swift
      - path: Sources/Ganymede/PageState.swift
      - path: Sources/Ganymede/KernelSpecs.swift
      - path: Sources/Ganymede/SettingsTab.swift
      - path: Sources/Ganymede/CodeFont.swift
      - path: Sources/Ganymede/ShortcutsPane.swift
      - path: Sources/Ganymede/KernelLog.swift
      - path: Sources/Ganymede/FolderEntry.swift
      - path: Sources/Ganymede/WorkspaceTabs.swift
      - path: Sources/Ganymede/FileSearch.swift
      - path: Sources/Ganymede/Terminal/SSHKey.swift
      - path: Sources/Ganymede/Editor/TextFile.swift
      - path: Sources/Ganymede/Editor/CodeEditing.swift
      - path: Sources/Ganymede/FileStack.swift
      - path: Sources/Ganymede/CrashScrub.swift
      - path: Sources/Ganymede/NotebookActions.swift
      - path: Sources/Ganymede/AppURL.swift
      - path: Sources/Ganymede/HelpLinks.swift
      - path: Sources/Ganymede/Runner/ScriptRunner.swift
      - path: Sources/Ganymede/Runner/ScriptIntents.swift
      - path: Sources/Share/ShareNotebooks.swift
      - path: Sources/Share/ShareInput.swift
      - path: Sources/Share/AppGroup.swift
      - path: build/runner
        type: folder
        buildPhase: resources
    dependencies:
      - framework: build/GanymedeFFI.xcframework
        embed: false
      - package: GanymedeDevice
        product: DeviceBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ganymede:
    build:
      targets:
        Ganymede: all
        GanymedeTests: [test]
    test:
      targets: [GanymedeTests]
  Ganymede-iOS:
    build:
      targets:
        Ganymede-iOS: all
        GanymedeTests-iOS: [test]
    test:
      targets: [GanymedeTests-iOS]
