# XcodeGen spec: `xcodegen generate` writes Ganymede.xcodeproj (not
# committed). scripts/bootstrap.sh fills build/ first.
name: Ganymede
options:
  bundleIdPrefix: com.ganymede-server
  deploymentTarget:
    macOS: '13.0'
    iOS: '16.0'
  createIntermediateGroups: true
packages:
  # The terminal view (MIT), on macOS and iOS. libghostty may replace it
  # once its official Swift package ships (#117).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.2
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  Ganymede:
    type: application
    platform: macOS
    sources:
      - path: Sources/Ganymede
      # ganymede-ui's build, served by the in-process server.
      - path: build/web
        type: folder
        buildPhase: resources
    dependencies:
      - framework: build/GanymedeFFI.xcframework
        embed: false
      - package: SwiftTerm
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Ganymede
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: MIT License
        # The web view loads the server on 127.0.0.1 over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Opens .ipynb files from the Finder, and can be their default app
        # (#130). The type is imported: Jupyter defines the format.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Jupyter Notebook
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.jupyter.ipynb
          # By extension, for when another app's type for .ipynb wins over
          # ours: the Finder still offers Ganymede in Open With. (An entry
          # with LSItemContentTypes ignores CFBundleTypeExtensions.)
          - CFBundleTypeName: Jupyter Notebook (by extension)
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - ipynb
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.jupyter.ipynb
            UTTypeDescription: Jupyter Notebook
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - ipynb
              public.mime-type:
                - application/x-ipynb+json
    entitlements:
      path: build/Ganymede.entitlements
      properties:
        # Kernels are child processes from installed kernelspecs, which
        # the App Sandbox does not allow; distribution is Developer ID.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganymede-server.Ganymede
        ENABLE_HARDENED_RUNTIME: YES
  # iPad and iPhone, from the same sources. iOS cannot launch kernel
  # processes, so until an on-device kernel exists it edits notebooks
  # without running them.
  Ganymede-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Ganymede
      - path: build/web
        type: folder
        buildPhase: resources
    dependencies:
      - framework: build/GanymedeFFI.xcframework
        embed: false
      - package: SwiftTerm
    info:
      path: build/Info-iOS.plist
      properties:
        CFBundleDisplayName: Ganymede
        NSHumanReadableCopyright: MIT License
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The Documents folder appears in the Files app, and notebooks
        # there are edited in place.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganymede-server.Ganymede
        PRODUCT_NAME: Ganymede
        TARGETED_DEVICE_FAMILY: '1,2'
  GanymedeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GanymedeTests
      - path: Sources/Ganymede/ServerHost.swift
      - path: Sources/Ganymede/KernelHost.swift
      - path: Sources/Ganymede/Terminal/TerminalTransport.swift
      - path: Sources/Ganymede/Terminal/JupyterTerminalTransport.swift
      - path: Sources/Ganymede/WindowTarget.swift
    dependencies:
      - framework: build/GanymedeFFI.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  GanymedeTests-iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/GanymedeTests
      - path: Sources/Ganymede/ServerHost.swift
      - path: Sources/Ganymede/KernelHost.swift
      - path: Sources/Ganymede/Terminal/TerminalTransport.swift
      - path: Sources/Ganymede/Terminal/JupyterTerminalTransport.swift
      - path: Sources/Ganymede/WindowTarget.swift
    dependencies:
      - framework: build/GanymedeFFI.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ganymede:
    build:
      targets:
        Ganymede: all
        GanymedeTests: [test]
    test:
      targets: [GanymedeTests]
  Ganymede-iOS:
    build:
      targets:
        Ganymede-iOS: all
        GanymedeTests-iOS: [test]
    test:
      targets: [GanymedeTests-iOS]
