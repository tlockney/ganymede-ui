<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title desc">
  <title id="title">ganymede-ui backends</title>
  <desc id="desc">The shell and notebook talk only to a ServiceManager. One of three backends builds it: ganymede over REST and websocket, ganymede with kernels in the page, or browser. Server-backed modes keep notebooks on Ganymede; the page modes run kernels in Web Workers; browser mode stores notebooks in IndexedDB.</desc>
  <style>
    .t { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1d1f; }
    .h { font-weight: 600; }
    .m { font: 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #1d1d1f; }
    .s { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5f5f63; }
    .box { fill: #f6f6f7; stroke: #c2c2c4; stroke-width: 1; }
    .key { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.5; }
    .alt { fill: #eef7ee; stroke: #4f9a5a; stroke-width: 1; }
    .frame { fill: none; stroke: #8e8e93; stroke-width: 1; stroke-dasharray: 5 4; }
    .arr { fill: none; stroke: #6e6e73; stroke-width: 1.4; }
    .head { fill: #6e6e73; }
    @media (prefers-color-scheme: dark) {
      .t, .m { fill: #ececf0; }
      .s { fill: #a0a0a8; }
      .box { fill: #2a2a2e; stroke: #4a4a50; }
      .key { fill: #1d2b45; stroke: #6f9bf0; }
      .alt { fill: #1e3022; stroke: #5fae6a; }
      .frame { stroke: #8e8e93; }
      .arr { stroke: #a0a0a8; }
      .head { fill: #a0a0a8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="frame" x="20" y="20" width="720" height="330" rx="10"/>
  <text class="s" x="34" y="40">the page</text>

  <rect class="box" x="40" y="52" width="320" height="56" rx="8"/>
  <text class="t h" x="200" y="76" text-anchor="middle">Shell (React)</text>
  <text class="s" x="200" y="96" text-anchor="middle">sidebar, toolbar, sheets</text>
  <rect class="box" x="400" y="52" width="320" height="56" rx="8"/>
  <text class="t h" x="560" y="76" text-anchor="middle">NotebookPane</text>
  <text class="s" x="560" y="96" text-anchor="middle">JupyterLab Notebook + SessionContext</text>

  <path class="arr" d="M200,108 V124 H330 V138" marker-end="url(#a)"/>
  <path class="arr" d="M560,108 V124 H430 V138" marker-end="url(#a)"/>

  <rect class="key" x="230" y="140" width="300" height="50" rx="8"/>
  <text class="m h" x="380" y="162" text-anchor="middle">ServiceManager.IManager</text>
  <text class="s" x="380" y="180" text-anchor="middle">the only thing the UI talks to</text>

  <path class="arr" d="M300,190 V204 H145 V218" marker-end="url(#a)"/>
  <path class="arr" d="M380,190 V218" marker-end="url(#a)"/>
  <path class="arr" d="M460,190 V204 H615 V218" marker-end="url(#a)"/>

  <rect class="box" x="40" y="220" width="210" height="52" rx="8"/>
  <text class="m h" x="145" y="242" text-anchor="middle">ganymede</text>
  <text class="s" x="145" y="261" text-anchor="middle">REST + websocket</text>
  <rect class="box" x="275" y="220" width="210" height="52" rx="8"/>
  <text class="m h" x="380" y="242" text-anchor="middle">ganymede, kernels: page</text>
  <text class="s" x="380" y="261" text-anchor="middle">server notebooks, page kernels</text>
  <rect class="box" x="510" y="220" width="210" height="52" rx="8"/>
  <text class="m h" x="615" y="242" text-anchor="middle">browser</text>
  <text class="s" x="615" y="261" text-anchor="middle">everything in the page</text>

  <rect class="alt" x="420" y="292" width="250" height="46" rx="8"/>
  <text class="t h" x="545" y="312" text-anchor="middle">Web Worker kernels</text>
  <text class="s" x="545" y="329" text-anchor="middle">cdp-kernel TypeScript, JavaScript</text>
  <path class="arr" d="M450,272 V290" marker-end="url(#a)"/>
  <path class="arr" d="M580,272 V290" marker-end="url(#a)"/>

  <path class="arr" d="M145,272 V398" marker-end="url(#a)"/>
  <path class="arr" d="M310,272 V398" marker-end="url(#a)"/>
  <text class="s" x="318" y="378">notebooks</text>
  <path class="arr" d="M700,272 V398" marker-end="url(#a)"/>
  <text class="s" x="692" y="378" text-anchor="end">notebooks</text>

  <rect class="box" x="40" y="400" width="330" height="56" rx="8"/>
  <text class="t h" x="205" y="424" text-anchor="middle">Ganymede, or any Jupyter server</text>
  <text class="s" x="205" y="444" text-anchor="middle">notebooks; kernels unless the page runs them</text>
  <rect class="box" x="510" y="400" width="210" height="56" rx="8"/>
  <text class="t h" x="615" y="424" text-anchor="middle">IndexedDB</text>
  <text class="s" x="615" y="444" text-anchor="middle">in this browser</text>
</svg>
