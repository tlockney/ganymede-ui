<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Ganymede for macOS and iPadOS</title>
  <desc id="desc">One app process holds the SwiftUI app, the Ganymede server from the GanymedeFFI static library, and a WKWebView showing ganymede-ui. The app starts the server and loads its URL in the web view, which talks to the server over HTTP and websocket. On the Mac the server launches installed kernelspecs; with a kernel server set it forwards kernels there; on the iPad without one, the page runs cdp-kernel in a Worker.</desc>
  <style>
    .t { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1d1f; }
    .h { font-weight: 600; }
    .m { font: 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #1d1d1f; }
    .s { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5f5f63; }
    .box { fill: #f6f6f7; stroke: #c2c2c4; stroke-width: 1; }
    .key { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.5; }
    .alt { fill: #eef7ee; stroke: #4f9a5a; stroke-width: 1; }
    .frame { fill: none; stroke: #8e8e93; stroke-width: 1; stroke-dasharray: 5 4; }
    .arr { fill: none; stroke: #6e6e73; stroke-width: 1.4; }
    .head { fill: #6e6e73; }
    @media (prefers-color-scheme: dark) {
      .t, .m { fill: #ececf0; }
      .s { fill: #a0a0a8; }
      .box { fill: #2a2a2e; stroke: #4a4a50; }
      .key { fill: #1d2b45; stroke: #6f9bf0; }
      .alt { fill: #1e3022; stroke: #5fae6a; }
      .frame { stroke: #8e8e93; }
      .arr { stroke: #a0a0a8; }
      .head { fill: #a0a0a8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="frame" x="20" y="20" width="720" height="300" rx="10"/>
  <text class="s" x="34" y="40">Ganymede.app, one process</text>

  <rect class="box" x="40" y="56" width="320" height="60" rx="8"/>
  <text class="t h" x="200" y="81" text-anchor="middle">SwiftUI app</text>
  <text class="s" x="200" y="101" text-anchor="middle">AppModel, folder picker, settings</text>

  <rect class="box" x="450" y="56" width="270" height="60" rx="8"/>
  <text class="m h" x="585" y="81" text-anchor="middle">WKWebView</text>
  <text class="s" x="585" y="101" text-anchor="middle">ganymede-ui, the bundled dist/</text>
  <path class="arr" d="M360,86 H448" marker-end="url(#a)"/>
  <text class="s" x="405" y="78" text-anchor="middle">loads URL</text>

  <path class="arr" d="M200,116 V168" marker-end="url(#a)"/>
  <text class="m" x="210" y="140">ganymede_server_start(json)</text>
  <text class="s" x="210" y="157">returns its URL with a token</text>

  <rect class="key" x="40" y="170" width="320" height="100" rx="8"/>
  <text class="t h" x="200" y="194" text-anchor="middle">Ganymede server (GanymedeFFI, Rust)</text>
  <text class="s" x="200" y="214" text-anchor="middle">on 127.0.0.1, token traded for a login cookie</text>
  <text class="m" x="60" y="238">root_dir   = notebook folder</text>
  <text class="m" x="60" y="256">static_dir = bundled dist/</text>

  <path class="arr" d="M500,116 V220 H362" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s" x="508" y="178">HTTP + websocket</text>

  <rect class="alt" x="440" y="236" width="280" height="56" rx="8"/>
  <text class="t h" x="580" y="258" text-anchor="middle">cdp-kernel in a Worker</text>
  <text class="s" x="580" y="277" text-anchor="middle">iPad without a kernel server (kernels=page)</text>
  <path class="arr" d="M660,116 V234" marker-end="url(#a)"/>

  <path class="arr" d="M120,270 V368" marker-end="url(#a)"/>
  <text class="s" x="128" y="350">Mac: launches</text>
  <path class="arr" d="M300,270 V368" marker-end="url(#a)"/>
  <text class="m" x="308" y="350">gateway_url</text>

  <rect class="box" x="40" y="370" width="200" height="56" rx="8"/>
  <text class="t h" x="140" y="394" text-anchor="middle">Installed kernelspecs</text>
  <text class="s" x="140" y="413" text-anchor="middle">kernel processes on the Mac</text>
  <rect class="box" x="260" y="370" width="240" height="56" rx="8"/>
  <text class="t h" x="380" y="394" text-anchor="middle">Kernel server, if set</text>
  <text class="s" x="380" y="413" text-anchor="middle">another Jupyter or Ganymede server</text>
</svg>
